<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Alfred</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=JetBrains+Mono:wght@300;400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a0a;
    color: #c8c8c8;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 18px 28px;
    background: #0a0a0a;
    border-bottom: 1px solid #1c1c1c;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .status-ring {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #f59e0b;
    box-shadow: 0 0 6px #f59e0b;
    flex-shrink: 0;
  }

  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 20px;
    letter-spacing: 0.12em;
    color: #e8e8e8;
  }

  .mode-switcher {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mode-label {
    font-size: 10px;
    color: #2a2a2a;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-right: 4px;
  }

  .mode-btn {
    background: transparent;
    border: 1px solid #1e1e1e;
    border-radius: 3px;
    color: #2e2e2e;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.15s;
    height: auto;
    white-space: nowrap;
  }

  .mode-btn:hover { border-color: #333; color: #666; }

  .mode-btn.active {
    border-color: #4ade80;
    color: #4ade80;
    box-shadow: 0 0 6px rgba(74,222,128,0.15);
  }

  .mode-btn.loading {
    border-color: #f59e0b;
    color: #f59e0b;
    cursor: wait;
  }

  #status-text {
    font-size: 10px;
    color: #3a3a3a;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #warmup-banner {
    display: none;
    background: #0f0f0f;
    border-bottom: 1px solid #1c1c1c;
    padding: 8px 28px;
    font-size: 11px;
    color: #3a3a3a;
    letter-spacing: 0.06em;
    align-items: center;
    gap: 10px;
  }

  #warmup-banner.visible { display: flex; }

  #mode-banner {
    display: none;
    background: #0f0f0f;
    border-bottom: 1px solid #1c1c1c;
    padding: 8px 28px;
    font-size: 11px;
    color: #f59e0b;
    letter-spacing: 0.06em;
    align-items: center;
    gap: 10px;
  }

  #mode-banner.visible { display: flex; }

  .warmup-dots span {
    display: inline-block;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: currentColor;
    margin: 0 2px;
    animation: pulse 1.2s infinite;
  }

  .warmup-dots span:nth-child(2) { animation-delay: 0.2s; }
  .warmup-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes pulse {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .message {
    display: flex;
    gap: 14px;
    max-width: 860px;
    width: 100%;
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.assistant { align-self: flex-start; }

  .avatar {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    border: 1px solid #222;
  }

  .message.user .avatar { background: #111; color: #888; }
  .message.assistant .avatar { background: #111; color: #888; font-family: 'Cormorant Garamond', serif; font-size: 14px; }

  .bubble {
    padding: 12px 16px;
    border-radius: 4px;
    line-height: 1.7;
    font-size: 13px;
    max-width: 720px;
    white-space: pre-wrap;
    word-break: break-word;
    letter-spacing: 0.01em;
  }

  .message.user .bubble {
    background: #141414;
    color: #d0d0d0;
    border: 1px solid #222;
    border-top-right-radius: 0;
  }

  .message.assistant .bubble {
    background: transparent;
    border: 1px solid #1c1c1c;
    color: #c8c8c8;
    border-top-left-radius: 0;
  }

  .bubble code {
    background: #111;
    padding: 1px 6px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #888;
    border: 1px solid #1e1e1e;
  }

  .bubble pre {
    background: #0d0d0d;
    border: 1px solid #1c1c1c;
    border-radius: 4px;
    padding: 14px;
    overflow-x: auto;
    margin-top: 10px;
  }

  .bubble pre code {
    background: none;
    padding: 0;
    color: #a0a0a0;
    border: none;
    font-size: 12px;
  }

  .typing {
    color: #3a3a3a;
    font-style: italic;
    font-size: 12px;
    letter-spacing: 0.05em;
  }

  #input-area {
    padding: 16px 28px;
    background: #0a0a0a;
    border-top: 1px solid #1c1c1c;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  textarea {
    flex: 1;
    background: #0f0f0f;
    border: 1px solid #1c1c1c;
    border-radius: 4px;
    color: #c8c8c8;
    padding: 12px 14px;
    font-size: 13px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 300;
    resize: none;
    outline: none;
    line-height: 1.6;
    max-height: 160px;
    min-height: 46px;
    transition: border-color 0.2s;
    letter-spacing: 0.01em;
  }

  textarea:focus { border-color: #333; }
  textarea::placeholder { color: #2a2a2a; }

  button {
    border: none;
    border-radius: 4px;
    padding: 0 18px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.15s;
    height: 46px;
    white-space: nowrap;
  }

  #send-btn {
    background: #1a1a1a;
    color: #888;
    border: 1px solid #2a2a2a;
  }

  #send-btn:hover { background: #222; color: #c8c8c8; border-color: #333; }
  #send-btn:disabled { background: #0f0f0f; color: #2a2a2a; cursor: not-allowed; border-color: #161616; }

  #stop-btn {
    display: none;
    background: transparent;
    border: 1px solid #3a1a1a;
    color: #7a3a3a;
    padding: 0 18px;
  }

  #stop-btn:hover { border-color: #f87171; color: #f87171; }
  #stop-btn.visible { display: block; }

  #clear-btn {
    background: transparent;
    border: 1px solid #1a1a1a;
    color: #2e2e2e;
    padding: 0 14px;
  }

  #clear-btn:hover { border-color: #2a2a2a; color: #555; }

  .empty-state {
    text-align: center;
    margin: auto;
    color: #2a2a2a;
    user-select: none;
  }

  .empty-state h2 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 36px;
    color: #2e2e2e;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  #shutdown-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }

  #shutdown-overlay.visible { display: flex; }

  #overlay-title {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 22px;
    color: #2e2e2e;
    letter-spacing: 0.08em;
  }

  #overlay-sub {
    font-size: 11px;
    color: #1e1e1e;
    letter-spacing: 0.06em;
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1c1c1c; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <div class="status-ring" id="status-dot"></div>
  <h1>Alfred</h1>
  <span id="status-text">Initializing...</span>
  <div class="mode-switcher">
    <span class="mode-label">Mode</span>
    <button class="mode-btn" id="btn-low" onclick="switchMode('low')">Low</button>
    <button class="mode-btn" id="btn-medium" onclick="switchMode('medium')">Medium</button>
    <button class="mode-btn" id="btn-high" onclick="switchMode('high')">High</button>
  </div>
</header>

<div id="warmup-banner">
  <div class="warmup-dots"><span></span><span></span><span></span></div>
  <span>Warming up, Sir. First response may take a moment...</span>
</div>

<div id="mode-banner">
  <div class="warmup-dots"><span></span><span></span><span></span></div>
  <span>Applying mode change, Sir...</span>
</div>

<div id="chat">
  <div class="empty-state" id="empty">
    <h2>How may I be of service, Sir?</h2>
  </div>
</div>

<div id="input-area">
  <button id="clear-btn" onclick="clearChat()">Clear</button>
  <textarea
    id="input"
    placeholder="Your orders, Sir..."
    rows="1"
    onkeydown="handleKey(event)"
    oninput="autoResize(this)"
  ></textarea>
  <button id="stop-btn" onclick="stopGeneration()">Stop</button>
  <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<div id="shutdown-overlay">
  <p id="overlay-title">Until next time, Sir.</p>
  <span id="overlay-sub">Alfred has retired for the session.</span>
</div>

<script>
  const OLLAMA_URL = 'http://localhost:11434';
  const MODE_URL = 'http://localhost:11435';
  const MODEL = 'qwen-coder';
  let history = [];
  let isGenerating = false;
  let firstMessage = true;
  let abortController = null;
  let serverAlive = true;
  let currentMode = 'medium';
  let userScrolledUp = false;

  const chat = document.getElementById('chat');

  chat.addEventListener('scroll', () => {
    const distFromBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight;
    userScrolledUp = distFromBottom > 80;
  });

  function scrollToBottom() {
    if (!userScrolledUp) chat.scrollTop = chat.scrollHeight;
  }

  function setActiveMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`btn-${mode}`);
    if (btn) btn.classList.add('active');
  }

  async function loadCurrentMode() {
    try {
      const res = await fetch(`${MODE_URL}/status`);
      const data = await res.json();
      setActiveMode(data.current || 'medium');
    } catch {
      setActiveMode('medium');
    }
  }

  async function checkConnection() {
    try {
      const res = await fetch(`${OLLAMA_URL}/api/tags`);
      if (res.ok) {
        setStatus('green', 'Ready');
        startHeartbeat();
      }
    } catch {
      setStatus('red', 'Offline — run ./run.sh first');
    }
  }

  function setStatus(color, text) {
    const colors = { green: '#4ade80', red: '#f87171', yellow: '#f59e0b' };
    const c = colors[color] || color;
    document.getElementById('status-dot').style.cssText =
      `width:8px;height:8px;border-radius:50%;background:${c};box-shadow:0 0 6px ${c};flex-shrink:0;`;
    document.getElementById('status-text').textContent = text;
  }

  function startHeartbeat() {
    setInterval(async () => {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 2000);
        await fetch(`${OLLAMA_URL}/api/tags`, { signal: ctrl.signal });
        clearTimeout(t);
      } catch {
        if (serverAlive) {
          serverAlive = false;
          document.getElementById('shutdown-overlay').classList.add('visible');
        }
      }
    }, 2000);
  }

  async function switchMode(mode) {
    if (mode === currentMode) return;

    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.remove('active');
      b.classList.add('loading');
      b.disabled = true;
    });

    document.getElementById('mode-banner').classList.add('visible');
    document.getElementById('send-btn').disabled = true;

    try {
      await fetch(`${MODE_URL}/mode`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode })
      });
    } catch {}

    // server will shut down — show restart overlay
    document.getElementById('overlay-title').textContent = 'Mode changed, Sir.';
    document.getElementById('overlay-sub').textContent =
      `Switched to ${mode} mode. Please run ./run.sh to restart Alfred.`;
    document.getElementById('shutdown-overlay').classList.add('visible');
  }

  checkConnection();
  loadCurrentMode();

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function showStop() {
    document.getElementById('stop-btn').classList.add('visible');
    document.getElementById('send-btn').disabled = true;
  }

  function hideStop() {
    document.getElementById('stop-btn').classList.remove('visible');
    document.getElementById('send-btn').disabled = false;
  }

  function stopGeneration() {
    if (abortController) { abortController.abort(); abortController = null; }
  }

  function addMessage(role, content) {
    const empty = document.getElementById('empty');
    if (empty) empty.remove();
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="avatar">${role === 'user' ? '✦' : 'A'}</div>
      <div class="bubble">${escapeHtml(content)}</div>
    `;
    chat.appendChild(div);
    userScrolledUp = false;
    scrollToBottom();
    return div.querySelector('.bubble');
  }

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatResponse(text) {
    return escapeHtml(text)
      .replace(/```(\w+)?\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }

  async function sendMessage() {
    if (isGenerating) return;
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = '46px';
    isGenerating = true;
    showStop();

    if (firstMessage) document.getElementById('warmup-banner').classList.add('visible');

    history.push({ role: 'user', content: text });
    addMessage('user', text);
    const assistantBubble = addMessage('assistant', '');
    assistantBubble.innerHTML = '<span class="typing">One moment, Sir...</span>';
    let fullResponse = '';
    abortController = new AbortController();

    try {
      const res = await fetch(`${OLLAMA_URL}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: MODEL, messages: history, stream: true }),
        signal: abortController.signal
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      assistantBubble.innerHTML = '';
      document.getElementById('warmup-banner').classList.remove('visible');
      firstMessage = false;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const lines = decoder.decode(value).split('\n').filter(Boolean);
        for (const line of lines) {
          try {
            const json = JSON.parse(line);
            if (json.message?.content) {
              fullResponse += json.message.content;
              assistantBubble.innerHTML = formatResponse(fullResponse);
              scrollToBottom();
            }
          } catch {}
        }
      }
      history.push({ role: 'assistant', content: fullResponse });

    } catch (err) {
      document.getElementById('warmup-banner').classList.remove('visible');
      if (err.name === 'AbortError') {
        if (fullResponse) {
          assistantBubble.innerHTML = formatResponse(fullResponse) +
            '<br><span style="color:#3a3a3a;font-size:11px;font-style:italic"> — stopped, Sir.</span>';
          history.push({ role: 'assistant', content: fullResponse });
        } else {
          assistantBubble.innerHTML =
            '<span style="color:#3a3a3a;font-style:italic;font-size:12px">Stopped, Sir.</span>';
        }
      } else {
        assistantBubble.innerHTML =
          '<span style="color:#3a3a3a">I seem to be unavailable, Sir. Is the server running?</span>';
      }
    }

    isGenerating = false;
    abortController = null;
    hideStop();
    document.getElementById('input').focus();
  }

  function clearChat() {
    history = [];
    firstMessage = true;
    userScrolledUp = false;
    chat.innerHTML =
      `<div class="empty-state" id="empty"><h2>How may I be of service, Sir?</h2></div>`;
  }
</script>
</body>
</html>
